[ALSA]
Card=mt6877-mt6359

[MediaTek]
Generation=gen97
AudioDeviceConfig=/vendor/etc/audio_device.xml
AudioParamDirectory=/vendor/etc/audio_param

[MediaTek.Speech]
# /dev/ccci_aud is the AP <-> modem speech control channel.
# It carries speech commands and acknowledgements such as SPH_ON/SPH_OFF,
# mute/device change messages, and is also used with GET_MD_STATE to verify
# that MD1 is ready before sending speech commands.
ControlDevice=/dev/ccci_aud

# /dev/ccci_raw_audio exposes the CCCI speech shared memory region.
# audio-manager mmaps this region for MD <-> AP shared speech data and can
# also use it as an alternative transport for the generated speech parameter
# image when USIP is not selected.
SharedMemoryDevice=/dev/ccci_raw_audio

# /dev/usip exposes the USIP/EMI shared memory region used by GEN97.
# It is the preferred AP -> MD1 transport for the generated speech parameter image.
UsipDevice=/dev/usip

# ALSA kctl used by the MTK driver to initialize the CCCI speech shared memory
# interface before the mapped region is used.
CcciShmInitControl=Speech_SHM_Init

# ALSA kctl used to initialize and enable the USIP speech shared memory interface.
UsipInitControl=Speech_SHM_USIP

# ALSA kctl used to publish the current USIP speech parameter write index so
# the modem knows where the newly written parameter block is available.
UsipWriteIndexControl=Speech_SHM_Widx

# Hostless_Speech is opened in both directions to keep the MTK hostless speech
# graph active. Userspace does not pump cellular call PCM through this node
# the actual hostless audio path is MD1 <-> AFE/ADDA.
HostlessPcm=Hostless_Speech
SampleRate=48000
Channels=2
Format=S16_LE

# Hostless PCM hardware buffer geometry. At 48 kHz, 1024 frames is about
# 21.3 ms per period and two periods give about 42.7 ms of ALSA buffer space.
PeriodSize=1024
PeriodCount=2

# Prefer USIP for speech parameter transfer. CCCI SHM remains enabled because
# it is also used for general MD <-> AP speech shared data.
UseUsip=true
UseCcciSharedMemory=true

# Number of external SmartPA speaker amplifiers reported to MD1 in MtkSphInfo.
# This affects modem side speech and DSP policy and is separate from runtime
# Linux side SmartPA detection using the Awinic controls below.
SmartPaCount=1

[Call]
DefaultOutput=receiver
DefaultInput=builtin-mic

[Routes]
# Named paths from audio_device.xml used for local playback routing.
# Multiple comma separated paths are applied together, so speaker output
# enables both the MT6359/ADDA speaker route and the external SmartPA route.
ReceiverOutput=receiver_output
SpeakerOutput=speaker_output,ext_speaker_output
HeadphonesOutput=headphone_output
HeadsetOutput=headphone_output

# Named audio_device.xml paths used to route the selected microphone into
# the MTK capture uplink side.
BuiltinMicInput=builtin_Mic_SingleMic
HeadsetMicInput=headset_mic_input

# Hostless cellular speech routes between the codec facing ADDA interface
# and modem MD1.
#
# Uplink:
#   microphone -> ADDA_UL -> MD1
#
# Downlink:
#   MD1 -> ADDA_DL -> receiver/speaker/headset
ModemUplink=ADDA_UL_TO_MD1
ModemDownlink=MD1_TO_ADDA_DL
SpeakerModemDownlink=MD1_TO_ADDA_DL

# Values sent to the modem when the active call device changes.
#
# 0 = internal speech device class used by receiver, speaker and
#     the MTK Bluetooth CONNSYS speech path.
# 6 = wired headset/headphone external device class.
# 5 = AP/USB speech device class used by the hostful call path.
[MediaTek.Speech.Device]
Receiver=0
Speaker=0
Headphones=6
Headset=6
Bluetooth=0
USB=5

[MediaTek.Speech.Volume]
# Speech volume profile names from SpeechVol_AudioParam.xml. These select
# the modem downlink call volume table appropriate for each output device.
ReceiverProfile=RCV
SpeakerProfile=SPK
HeadphonesProfile=HP
HeadsetProfile=HS
BluetoothProfile=BT
UsbProfile=USB

# Analog gain profile names used by the MediaTek gain calculation.
# These select the appropriate AudioParam gain tables for the physical route.
ReceiverGainProfile=RCV_NORMAL
SpeakerGainProfile=SPK_LO
HeadphonesGainProfile=HS
HeadsetGainProfile=HS
BluetoothGainProfile=BT
UsbGainProfile=USB

[MediaTek.Streams]
# Default media playback/capture ALSA PCM interfaces.
PlaybackPcm=Playback_1
CapturePcm=Capture_1

# audio_device.xml AFE routes connecting those PCM memory interfaces to ADDA.
#
# Playback:
#   userspace -> Playback_1 -> ADDA_DL -> codec/output
#
# Capture:
#   microphone/ADDA -> Capture_1 -> userspace
PlaybackRoute=PLAYBACK1_TO_ADDA_DL
CaptureRoute=ADDA_TO_CAPTURE1

# ALSA scenario kctl applied while normal playback is active. MTK uses these
# scenario controls to select the appropriate AFE, power and performance policy.
PlaybackScenarioControl=primary_play_scenario

# Low latency playback uses Playback_1 as well, but with a separate MTK
# scenario and much smaller ALSA periods.
FastPlaybackPcm=Playback_1
FastPlaybackRoute=PLAYBACK1_TO_ADDA_DL
FastPlaybackScenarioControl=fast_play_scenario

# At 48 kHz:
#   256 frames ~= 5.3 ms per period
#   2 periods  ~= 10.7 ms total PCM buffer
FastPlaybackPeriodSize=256
FastPlaybackPeriodCount=2

# Deep buffer playback uses a separate AFE memory interface.
# It trades latency for fewer userspace wakeups and lower power consumption.
DeepBufferPlaybackPcm=Playback_3
DeepBufferPlaybackRoute=PLAYBACK3_TO_ADDA_DL
DeepBufferPlaybackScenarioControl=deep_buffer_scenario

# At 48 kHz:
#   2048 frames ~= 42.7 ms per period
#   2 periods   ~= 85.3 ms total PCM buffer
DeepBufferPlaybackPeriodSize=2048
DeepBufferPlaybackPeriodCount=2

# MTK capture XRUN assertion kctl. This can be inspected
# by the backend to report a capture overrun.
CaptureXrunControl=record_xrun_assert

# Default playback buffer geometry used when no fast or deep buffer override is
# selected. At 48 kHz, 2048 x 2 is about 85.3 ms of PCM buffering.
PlaybackPeriodSize=2048
PlaybackPeriodCount=2

CaptureRate=48000
CaptureChannels=2

# At 48 kHz:
#   1024 frames ~= 21.3 ms per period
#   4 periods   ~= 85.3 ms total capture buffer
CapturePeriodSize=1024
CapturePeriodCount=4

# Hostful cellular call PCM
#
# Downlink:
#   MD1 -> Capture_2 -> userspace
#
# Uplink:
#   userspace -> Playback_2 -> MD1
[MediaTek.Call.Hostful]
DownlinkPcm=Capture_2
DownlinkRoute=MD1_TO_CAPTURE2
UplinkPcm=Playback_2
UplinkRoute=PLAYBACK2_TO_MD1
SampleRate=48000
Channels=2
Format=S16_LE

# At 48 kHz:
#   240 frames ~= 5 ms per period
#   8 periods  ~= 40 ms total PCM buffer
PeriodSize=240
PeriodCount=8

[MediaTek.Hostless]
# Hostless FM uses the CONNSYS -> ADDA downlink hardware path. Opening the
# Hostless_FM PCM keeps that AFE graph active. Userspace does not pump the
# FM samples through the PCM.
FmPcm=Hostless_FM
FmRoute=CONNSYS_TO_ADDA_DL

# Hostless loopback routes the ADDA uplink directly back to ADDA downlink:
#
#   mic -> ADC/ADDA_UL -> ADDA_DL/DAC -> output
#
# Hostless_LPBK keeps that hardware route active without userspace copying
# samples between capture and playback.
LoopbackPcm=Hostless_LPBK
LoopbackRoute=ADDA_UL_TO_ADDA_DL

FmPeriodSize=3072
SampleRate=48000
Channels=2
Format=S16_LE
PeriodSize=1024
PeriodCount=2

[MediaTek.SmartPA]
# Awinic SmartPA ALSA controls used for runtime detection.
# audio-manager currently only reads these controls.
# It does not program the mplifier profile itself.
#
# If any of these configured controls can be read, audio-manager treats the
# SmartPA as present. In that case it avoids programming the normal MT6359
# speaker analog PGA because the external amplifier owns that gain stage.

# Current Awinic speaker profile selection.
ProfileControl=aw87xxx_profile_switch_0

# SmartPA monitoring and protection state control.
MonitorControl=aw87xxx_monitor_switch_0

# SmartPA maximum output limit exposed by the Awinic driver.
VmaxControl=aw87xxx_vmax_get_0

# Awinic specific SPIN/DSP feature control exposed by the amplifier driver.
SpinControl=aw87xxx_spin_switch
